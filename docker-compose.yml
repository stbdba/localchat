services:
  localchat:
    image: stbdba/localchat:0.1.0
    container_name: localchat
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - APP_TITLE=LocalChat
      - APP_SUBTITLE=Local Network Communication
      # Optional: Set your host LAN IP & port so the QR code points to the exact access URL
      # Example: http://192.168.1.10:3000 (leave empty to auto-detect from browser URL)
      - QR_URL=
      # Set to "true" only if running behind a trusted reverse proxy (e.g., Nginx, Traefik, Caddy)
      - TRUST_PROXY=false
    volumes:
      - localchat_uploads:/app/uploads

volumes:
  localchat_uploads:
